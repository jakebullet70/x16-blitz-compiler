# Load BASLOAD as an ordinary PRG instead of a ROM bank.
#
# Only the CODE segment moves. ZEROPAGE, VARS (golden RAM) and RAM1 (bank 1)
# are where the program already puts them, and main_backup_ram / main_restore_ram
# already save and restore both, so a RAM-resident build is no less polite than
# the ROM one.
#
# SIGNATURE has nowhere to be -- it exists so the X16 ROM can identify the bank --
# so it is parked at the tail of CODE and ignored.
MEMORY {
    ZP:             file = "", start = $0022, size = $0080 - $0022, define = yes;
    VARMEM:         file = "", start = $0400, size = $0400, define = yes;
    RB1:            file = "", start = $a000, size = $2000, define = yes;
    MAIN:           file = %O, start = $6000, size = $2400, fill = no;
}
SEGMENTS {
    ZEROPAGE:   load = ZP,      type = zp,  define = yes;
    VARS:       load = VARMEM,  type = bss, define = yes;
    RAM1:       load = RB1,     type = bss, define = yes;
    CODE:       load = MAIN,    type = ro;
    SIGNATURE:  load = MAIN,    type = ro;
}
